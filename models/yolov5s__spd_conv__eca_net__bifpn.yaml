# Parameters
nc: 80 # number of classes
depth_multiple: 0.33 # model depth multiple
width_multiple: 0.50 # layer channel multiple
anchors:
  - [10, 13, 16, 30, 33, 23] # P3/8
  - [30, 61, 62, 45, 59, 119] # P4/16
  - [116, 90, 156, 198, 373, 326] # P5/32

# YOLOv5 v6.0 backbone
backbone:
  # [from, number, module, args]
  [
    [-1, 1, Conv, [64, 6, 2, 2]], # 0
    [-1, 1, Conv, [128, 3, 2]], # 1
    [-1, 3, C3, [128]], # 2
    [-1, 1, Conv, [256, 3, 2]], # 3
    [-1, 6, C3, [256]], # 4
    [-1, 1, Conv, [512, 3, 2]], # 5
    [-1, 9, C3, [512]], # 6
    [-1, 1, space_to_depth, [1]], # 7
    [-1, 1, Conv, [1024, 3, 1]], # 8
    [-1, 3, C3, [1024]], # 9
    [-1, 1, eca_layer, [3]], # 10
    [-1, 1, SPPF, [1024, 5]], # 11
  ]

# YOLOv5 v6.0 head
## conv args -> [c_out, kernel, stride]
head: [
    [-1, 1, Conv, [512, 1, 1]], # 12
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 13
    [[-1, 6], 1, Concat, [1]], # 14
    [-1, 3, C3, [512, False]], # 15

    [-1, 1, Conv, [256, 1, 1]], # 16
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 17
    [[-1, 4], 1, Concat, [1]], # 18
    [-1, 3, C3, [256, False]], # 19

    [-1, 1, space_to_depth, [1]], # 20
    [-1, 1, Conv, [256, 3, 1]], # 21
    [[-1, 6, 16], 1, Concat, [1]], # 22
    [-1, 3, C3, [512, False]], # 23

    [-1, 1, space_to_depth, [1]], # 24
    [-1, 1, Conv, [512, 3, 1]], # 25
    [[-1, 12], 1, Concat, [1]], # # 26
    [-1, 3, C3, [1024, False]], # 27

    [[19, 23, 27], 1, Detect, [nc, anchors]], # Detect
  ]
